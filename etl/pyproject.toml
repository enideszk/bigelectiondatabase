[project]
name = "etl"
version = "0.1.0"
description = "Hungarian election & socio-demographic data platform: database, loaders, export"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "geopandas>=1.2.0",
]

[project.scripts]
etl = "etl.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl"]

[tool.uv]
# The repo may live on a network drive; hard links into uv's cache do not work there.
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
